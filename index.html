<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uren</title>
<meta name="uren-web-version" content="2026.10.13.1">
<meta name="uren-min-app" content="2.0">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Huisstijl overgenomen van PPM Board (docs/HUISSTIJL.md): licht, rustig, Montserrat, dunne bediening. */
:root {
  color-scheme: light;
  --background: #f6f7f5;
  --foreground: #11152a;
  --primary: #000031;
  --muted: #68717d;
  --line: #dfe8e8;
  --panel: #ffffff;
  --panel-soft: #eef2f2;
  --blue: #0000dc;
  --green: #17735b;
  --orange: #ff4600;
  --rose: #d4145a;
  --shadow: 0 12px 34px rgba(0, 0, 49, 0.06);
  --font-ui: "Montserrat", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --text-2xs: 11px; --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-md: 15px; --text-lg: 18px; --text-xl: 22px;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-pill: 999px;
  --motion-fast: 120ms; --motion-normal: 180ms; --ease: cubic-bezier(0.2, 0, 0, 1);
  /* Namen die de app-code gebruikt, gekoppeld aan de PPM-tokens */
  --bg: var(--background); --ink: var(--foreground); --ink-2: var(--muted); --ink-3: #9aa3ad;
  --line-2: var(--panel-soft); --accent: var(--blue); --accent-soft: rgba(0, 0, 220, 0.08);
  --ok: var(--green); --warn: var(--orange); --warn-soft: rgba(255, 70, 0, 0.1); --bad: var(--rose);
  --unassigned: #9aa3ad; --radius: var(--radius-lg); --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-ui); font-size: var(--text-base); font-weight: var(--weight-regular); line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
button { cursor: pointer; }
b, strong { font-weight: var(--weight-semibold); }

/* 1. Applicatiebalk */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6); min-height: 56px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-size: var(--text-lg); font-weight: var(--weight-bold); color: var(--primary); display: flex; align-items: center; gap: var(--space-2); letter-spacing: -0.01em; }
.brand .dot { width: 10px; height: 10px; border-radius: var(--radius-sm); background: var(--primary); }
.tabs { display: flex; gap: var(--space-5); align-self: stretch; }
.tabs button { border: 0; background: transparent; padding: 0 2px; color: var(--muted); font-weight: var(--weight-regular); border-bottom: 2px solid transparent; white-space: nowrap; transition: color var(--motion-fast) var(--ease); }
.tabs button:hover { color: var(--primary); }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
.weeknav { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
.weeknav .wk { min-width: 190px; text-align: center; color: var(--primary); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }

/* Knoppen */
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border: 1px solid var(--line); background: var(--panel); padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--primary); font-weight: var(--weight-regular); white-space: nowrap; transition: border-color var(--motion-fast) var(--ease), background var(--motion-fast) var(--ease); }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--blue); border-color: var(--blue); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--primary); background: var(--panel-soft); }
.btn.danger { color: var(--rose); }
.btn.sm { min-height: 28px; padding: 0 var(--space-2); font-size: var(--text-sm); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); background: var(--panel-soft); color: var(--muted); border: 0; }
.pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.on .led { background: var(--green); }
.pill.paused .led { background: var(--orange); }
#refresh.busy .spin { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#refresh.busy { opacity: .7; pointer-events: none; }

/* Inhoud */
main { padding: var(--space-6) var(--space-6) 60px; max-width: 1500px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: var(--text-xs); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--primary); margin: 0 0 var(--space-1); line-height: 1.2; }
h3 { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--foreground); margin: 0 0 var(--space-2); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Samenvatting */
.summary { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--line); font-size: var(--text-sm); }
.chip .sw { width: 10px; height: 10px; border-radius: 2px; }
.chip b { font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); }
.chip.total { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--orange); cursor: pointer; }

/* Weekraster */
.grid { display: grid; overflow: hidden; }
.dayhead { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 64px; position: relative; }
.dayhead .d { font-weight: var(--weight-semibold); color: var(--primary); }
.dayhead .d.today { color: var(--blue); }
.dayhead .tot { font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.dayhead .open { color: var(--orange); }
.dayhead .add { position: absolute; right: 6px; top: 6px; opacity: .55; }
.dayhead:hover .add { opacity: 1; }
.alldays { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
.allday { font-size: var(--text-2xs); padding: 2px 6px; border-radius: var(--radius-sm); background: var(--panel-soft); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--unassigned); }
.gutter { position: relative; border-right: 1px solid var(--line); }
.gutter .h { position: absolute; right: 6px; font-size: var(--text-2xs); color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); }
.col .hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--panel-soft); }
.col .work { position: absolute; left: 0; right: 0; background: rgba(0, 0, 220, 0.025); }
.col .now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--rose); z-index: 5; }
.blk { position: absolute; border-radius: var(--radius-md); padding: 3px 6px; font-size: var(--text-xs); line-height: 1.25; overflow: hidden; cursor: pointer; border: 1px solid rgba(0, 0, 49, .08); color: var(--foreground); transition: box-shadow var(--motion-fast) var(--ease); }
.blk:hover { box-shadow: 0 0 0 2px var(--blue); z-index: 4; }
.blk .t { font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .m { color: rgba(17, 21, 42, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.blk.un { background: repeating-linear-gradient(135deg, #eef2f2 0 6px, #f8faf9 6px 12px); border: 1px dashed #b5bec8; }
.blk.ign { background: var(--panel-soft) !important; color: var(--muted); }
.blk.act { border-style: dashed; border-width: 1.5px; }
.blk.act.un { border-color: var(--orange); background: repeating-linear-gradient(135deg, rgba(255,70,0,.08) 0 6px, rgba(255,70,0,.03) 6px 12px); }
.blk.out { opacity: .5; }
.blk.man { cursor: grab; touch-action: none; }
.blk.man.dragging { cursor: grabbing; opacity: .85; box-shadow: 0 6px 18px rgba(0, 0, 49, .18); z-index: 6; }
.blk .resz { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
.col { touch-action: pan-y; }
.drag-ghost { position: absolute; left: 2px; right: 2px; border-radius: var(--radius-md); background: var(--accent-soft); border: 1.5px dashed var(--blue); color: var(--blue); font-size: var(--text-xs); padding: 3px 6px; pointer-events: none; z-index: 6; font-variant-numeric: tabular-nums; }
.ctxmenu { position: fixed; z-index: 70; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: 0 12px 34px rgba(0, 0, 49, .14); padding: var(--space-1); }
.ctxmenu .hd { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 10px 4px; }
.ctxmenu button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: var(--radius-sm); font-size: var(--text-sm); color: var(--foreground); }
.ctxmenu button:hover, .ctxmenu button:focus { background: var(--panel-soft); outline: none; }
.ctxmenu .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }
.ctxmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.kstep { display: grid; grid-template-columns: 14px 1fr; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--panel-soft); }
.kstep:last-child { border-bottom: 0; }
.kstep .led { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
.kstep .opts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-2); }
.kstep .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-2) var(--space-3); margin-top: var(--space-2); }
.blk .tag { display: inline-block; font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .06em; font-weight: var(--weight-regular); color: var(--muted); margin-right: 4px; }

/* Drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 34px rgba(0, 0, 49, .08); transform: translateX(105%); transition: transform var(--motion-normal) var(--ease); z-index: 40; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer .dh { padding: var(--space-4) var(--space-5) var(--space-3); border-bottom: 1px solid var(--line); display: flex; gap: var(--space-3); align-items: flex-start; }
#drawer .dh h2 { flex: 1; word-break: break-word; min-width: 0; }
#dClose { flex: 0 0 auto; width: 32px; justify-content: center; padding: 0; font-size: var(--text-md); }
#drawer .db { padding: var(--space-4) var(--space-5) var(--space-8); overflow: auto; flex: 1; }
.field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-3); }
.field label, .lbl { font-size: var(--text-xs); color: var(--muted); font-weight: var(--weight-regular); }
input[type=text], input[type=search], input[type=time], input[type=date], input[type=number], select, textarea { border: 1px solid var(--line); background: var(--panel); color: var(--foreground); border-radius: var(--radius-md); padding: 0 var(--space-2); min-height: 32px; width: 100%; }
textarea { resize: vertical; min-height: 60px; padding: var(--space-2); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
.row { display: flex; gap: var(--space-2); align-items: center; }
.row > * { flex: 1; }
.check { display: flex; gap: var(--space-2); align-items: flex-start; margin: 6px 0; }
.check input { margin-top: 3px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: var(--space-1) var(--space-3); font-size: var(--text-sm); margin-bottom: var(--space-4); }
.kv div:nth-child(odd) { color: var(--muted); }
.grp { display: grid; grid-template-columns: 1fr 52px 170px; gap: var(--space-2); align-items: center; padding: 7px 0; border-bottom: 1px solid var(--panel-soft); }
.grp .main { font-weight: var(--weight-semibold); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp .sub { font-size: var(--text-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp .min { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--text-xs); color: var(--muted); }
.grp select { font-size: var(--text-xs); }
.box { background: var(--panel-soft); border-radius: var(--radius-lg); padding: var(--space-3); margin: var(--space-3) 0; }
.actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }
.nrresults { display: flex; flex-direction: column; gap: 2px; margin-top: var(--space-1); }
.nrresults button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-md); padding: 6px var(--space-2); font-size: var(--text-sm); }
.nrresults button:hover { border-color: var(--blue); background: var(--accent-soft); }

/* Tabellen */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: var(--text-xs); color: var(--muted); font-weight: var(--weight-semibold); background: transparent; border-bottom-color: var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num.cp { cursor: copy; }
td.num.cp:hover { background: var(--accent-soft); }
tr.tot td { font-weight: var(--weight-semibold); border-top: 2px solid var(--line); }
tr.unrow td { color: var(--orange); }
.projtable td { padding: 5px 6px; }
.swatch { width: 30px; height: 28px; border: 0; padding: 0; background: none; }
.section { padding: var(--space-5) var(--space-6); margin-bottom: var(--space-4); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.banner { padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); background: var(--warn-soft); color: var(--foreground); border-left: 3px solid var(--orange); margin-bottom: var(--space-3); display: flex; gap: var(--space-3); align-items: center; }
.banner.okb { background: rgba(23, 115, 91, .1); border-left-color: var(--green); }
.stat { display: flex; gap: var(--space-2); align-items: center; margin: var(--space-1) 0; }
.stat .led { width: 8px; height: 8px; border-radius: 50%; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--primary); color: #fff; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); transition: transform var(--motion-normal) var(--ease); z-index: 60; font-size: var(--text-sm); }
#toast.on { transform: translateX(-50%); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
code { font-family: var(--mono); font-size: var(--text-xs); background: var(--panel-soft); padding: 1px 5px; border-radius: var(--radius-sm); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media (max-width: 760px) { .top { padding: var(--space-2) var(--space-4); gap: var(--space-3); } main { padding: var(--space-4); } .tabs { overflow-x: auto; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Uren</div>
  <nav class="tabs" id="tabs">
    <button data-tab="week" class="on">Week</button>
    <button data-tab="rapport">AFAS-rapport</button>
    <button data-tab="projecten">Projecten</button>
    <button data-tab="inhalen">Inhalen</button>
    <button data-tab="instellingen">Instellingen</button>
  </nav>
  <div class="weeknav">
    <button class="btn" id="prevWeek" title="Vorige week (←)">‹</button>
    <div class="wk" id="weekLabel"></div>
    <button class="btn" id="nextWeek" title="Volgende week (→)">›</button>
    <button class="btn" id="thisWeek">Deze week</button>
    <button class="btn" id="refresh" title="Agenda en activiteit opnieuw inlezen"><span class="spin">↻</span> Agenda verversen</button>
    <span class="small muted" id="calStamp"></span>
  </div>
  <button class="pill" id="agentPill"><span class="led"></span><span>Meter…</span></button>
</header>
<main id="view"></main>
<aside id="drawer"><div class="dh"><h2 id="dTitle"></h2><button class="btn ghost" id="dClose">✕</button></div><div class="db" id="dBody"></div></aside>
<div id="toast"></div>

<script>
'use strict';

// ---------- Hulpjes ----------
const MIN = 6e4;
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => new Date(k + 'T00:00:00');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmtTime = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hm = (min) => { const m = Math.round(min); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const DAYS = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const MONTHS_LONG = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 864e5 + 1) / 7) };
}
function at(date, hhmm) { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h || 0, m || 0).getTime(); }
function host(u) { try { return new URL(u).host.replace(/^www\./, ''); } catch { return ''; } }
const uid = () => Math.random().toString(36).slice(2, 9);
async function api(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg || 'Gekopieerd'); } catch { toast('Kopiëren lukte niet'); } }

// ---------- Standaarddata ----------
const PALETTE = ['#7aa2ff', '#f2a65a', '#6cc49a', '#e98aa9', '#b69cf2', '#62c6d4', '#e6c35c', '#9bb06a', '#f08a7a', '#8fa3b8'];
// Nieuwe gebruikers beginnen met de vaste interne posten. Eigen projecten komen uit AFAS (importeren in Instellingen › Koppelingen).
const DEFAULT_PROJECTS = [
  { id: 'p000119', nr: '000119', name: 'Intern - Acquisitie', admin: 'Techonomy B.V.', werksoort: 'VIDEO', color: '#7aa2ff', keywords: 'acquisitie, pitch, offerte, voorstel, kennismaking', fullDay: false, active: true },
  { id: 'p000565', nr: '000565', name: 'TVP - Overige producties/projecten', admin: 'Techonomy Video Production B.V.', werksoort: 'VIDEO', color: '#f2a65a', keywords: '', fullDay: false, active: true },
  { id: 'p000621', nr: '000621', name: 'Indirect - Verlof en vrije dagen', admin: 'Techonomy B.V.', werksoort: 'VIDEO', color: '#6cc49a', keywords: 'verlof, vakantie, vrije dag', fullDay: true, active: true },

// Bij twijfel passen we niets toe: de vraag gaat naar een collega (Instellingen › Koppelingen), het antwoord wordt pas daarna een regel.
const DEFAULT_QUESTIONS = [];
const DEFAULT_SETTINGS = {
  dayStart: '08:30', dayEnd: '18:00', weekend: false, rounding: 0.25, decimal: ',',
  chunkGap: 10, minChunk: 2, fillGaps: true, countOutside: false, includeFree: false, fullDayHours: 8, weekHours: 40, catchupFrom: '',
  placeholders: 'blok, nieuwe activiteit, new event', ownSources: '',

  askName: '', askSlack: '', updateUrl: 'https://raw.githubusercontent.com/wilsonbenjamins-collab/uren-app/main/index.html',
};
function defaultState() {
  return { version: 1, projects: DEFAULT_PROJECTS.map((p) => ({ ...p })), calendarMap: {}, calendarsOff: {}, assign: {}, manual: [], settings: { ...DEFAULT_SETTINGS }, reported: {}, questions: [], migrations: ['niet-bsb', 'wilson-vrij', 'defaults-3', 'twijfel-1', 'placeholders-2'] };
}
function normalize(s) {
  const d = defaultState();
  if (!s || !Array.isArray(s.projects)) s = d;
  const out = { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } };
  if (!out.projects.some((p) => p.id === 'ignore')) out.projects.push(d.projects.find((p) => p.id === 'ignore'));
  out.migrations = out.migrations || [];
  if (!out.migrations.includes('update-url-1')) {
    if (!out.settings.updateUrl) out.settings.updateUrl = DEFAULT_SETTINGS.updateUrl;
    out.migrations.push('update-url-1');
  }
  if (!out.migrations.includes('niet-bsb')) {
    const ign = out.projects.find((p) => p.id === 'ignore');
    if (!kwList(ign).includes('niet bsb')) ign.keywords = (ign.keywords ? ign.keywords + ', ' : '') + 'niet bsb';
    out.migrations.push('niet-bsb');
  }
  if (!out.migrations.includes('wilson-vrij')) {
    const v = out.projects.find((p) => p.nr === '000621');
    if (v && !kwList(v).includes('wilson vrij')) v.keywords = (v.keywords ? v.keywords + ', ' : '') + 'wilson vrij';
    out.migrations.push('wilson-vrij');
  }
  if (!out.migrations.includes('defaults-3')) {
    for (const dp of DEFAULT_PROJECTS) {
      const p = out.projects.find((x) => x.id === dp.id);
      if (!p) { out.projects.splice(out.projects.length - 1, 0, { ...dp }); continue; }
      const have = kwList(p);
      const add = kwList(dp).filter((k) => !have.includes(k));
      if (add.length) p.keywords = [p.keywords, ...add].filter(Boolean).join(', ');
    }
    out.migrations.push('defaults-3');
  }
  if (!out.migrations.includes('twijfel-1')) {
    // Eerder op gok toegepaste koppelingen terugdraaien; ze staan nu als vraag aan een collega.
    const drop = { p001286: ['eten & welzijn', 'eten+welzijn', 'eten en welzijn', 'reservering lego-room voor opbouw'], p001165: ['bridge-animatie-2026', 'bridgie', 'bridge animatie'], p001279: ['destap', 'de stap'] };
    for (const [id, kws] of Object.entries(drop)) {
      const p = out.projects.find((x) => x.id === id);
      if (!p) continue;
      p.keywords = kwList(p).filter((k) => !kws.includes(k)).join(', ');
      if (id === 'p001286') p.note = '';
      if (id !== 'p001286' && !kwList(p).length && !Object.values(out.assign).includes(id)) out.projects = out.projects.filter((x) => x !== p);
    }
    out.migrations.push('twijfel-1');
  }
  if (!out.migrations.includes('placeholders-2')) {
    const have = String(out.settings.placeholders || '').split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
    for (const t of ['nieuwe activiteit', 'new event']) if (!have.includes(t)) have.push(t);
    out.settings.placeholders = have.join(', ');
    out.migrations.push('placeholders-2');
  }
  out.questions = out.questions || [];
  for (const q of DEFAULT_QUESTIONS) if (!out.questions.some((x) => x.id === q.id)) out.questions.push({ ...q });
  out.calendarsSeen = out.calendarsSeen || {};
  return out;
}

const proj = (id) => state.projects.find((p) => p.id === id);

// ---------- Regels ----------
function kwList(p) { return (p.keywords || '').split(/[,\n]/).map((s) => s.trim().toLowerCase()).filter((s) => s.length >= 2); }
function matchProject(text, nrOnlyText = '') {
  text = String(text || '').toLowerCase();
  const nrText = (text + ' ' + String(nrOnlyText || '')).toLowerCase();
  let best = null, bestLen = 0;
  for (const p of state.projects) {
    if (p.active === false) continue;
    for (const k of kwList(p)) if (k.length > bestLen && text.includes(k)) { best = p.id; bestLen = k.length; }
    const nr = (p.nr || '').trim().toLowerCase();
    if (nr.length >= 4 && nr.length > bestLen && nrText.includes(nr)) { best = p.id; bestLen = nr.length; }
  }
  return best;
}
const seriesOf = (ev) => ev.id.split('@')[0];
// Verjaardagen horen nooit in de urenregistratie, uit welke agenda ze ook komen.
const isBirthday = (ev) => /verjaardag|birthday|\bjarig\b/i.test(ev.title || '');
function isPlaceholder(ev) {
  const t = String(ev.title || '').trim().toLowerCase();
  if (!t) return true; // naamloos agenda-item
  return (state.settings.placeholders || '').split(',').map((x) => x.trim().toLowerCase()).filter(Boolean).includes(t);
}
function eventProject(ev) {
  const k1 = 'ev:' + ev.id, k2 = 'evs:' + seriesOf(ev);
  if (k1 in state.assign) return { pid: state.assign[k1] || null, how: 'handmatig' };
  if (k2 in state.assign) return { pid: state.assign[k2] || null, how: 'reeks' };
  // Trefwoorden alleen op titel en locatie; in notities zoeken we alleen naar een exact AFAS-nummer.
  const m = matchProject([ev.title, ev.loc].join(' '), ev.notes);
  if (m) return { pid: m, how: 'regel' };
  const c = state.calendarMap[ev.cal];
  if (c) return { pid: c, how: 'agenda' };
  return { pid: null, how: '' };
}
function segProject(seg) {
  const k = 'seg:' + seg.s;
  if (k in state.assign) return { pid: state.assign[k] || null, how: 'handmatig' };
  const m = matchProject([seg.app, seg.title, seg.url, seg.doc].join(' '));
  return m ? { pid: m, how: 'regel' } : { pid: null, how: '' };
}
function segLabel(seg) {
  const h = host(seg.url);
  if (h) return { key: seg.app + '|' + h + '|' + seg.title, main: seg.title || h, sub: seg.app + ' · ' + h };
  if (seg.doc) { const parts = seg.doc.split('/'); return { key: seg.app + '|' + seg.doc, main: parts.pop(), sub: seg.app + ' · ' + parts.slice(-2).join('/') }; }
  return { key: seg.app + '|' + seg.title, main: seg.title || seg.app, sub: seg.title ? seg.app : '' };
}
function keywordCandidates(seg) {
  const out = [];
  if (seg.title) out.push(seg.title);
  const h = host(seg.url); if (h) out.push(h);
  if (seg.url) { try { const u = new URL(seg.url); const p = u.pathname.split('/').filter(Boolean)[0]; if (p) out.push(h + '/' + p); } catch {} }
  if (seg.doc) { const parts = seg.doc.split('/'); out.push(parts[parts.length - 1]); if (parts.length > 2) out.push(parts[parts.length - 2]); }
  out.push(seg.app);
  return [...new Set(out.filter(Boolean))];
}

// ---------- Intervalrekenen ----------
function overlapLen(cov, s, e) { let t = 0; for (const [a, b] of cov) { if (b <= s) continue; if (a >= e) break; t += Math.min(b, e) - Math.max(a, s); } return t; }
function coverAdd(cov, s, e) {
  const eff = (e - s) - overlapLen(cov, s, e);
  cov.push([s, e]);
  cov.sort((x, y) => x[0] - y[0]);
  for (let i = 0; i < cov.length - 1;) { if (cov[i + 1][0] <= cov[i][1]) { cov[i][1] = Math.max(cov[i][1], cov[i + 1][1]); cov.splice(i + 1, 1); } else i++; }
  return eff;
}
function subtract(cov, s, e) {
  const out = []; let c = s;
  for (const [a, b] of cov) { if (b <= c) continue; if (a >= e) break; if (a > c) out.push([c, a]); c = Math.max(c, b); }
  if (c < e) out.push([c, e]);
  return out;
}

// ---------- Dagberekening ----------
function computeDay(date, acts = activity) {
  const S = state.settings;
  const d0 = date.getTime(), d1 = addDays(date, 1).getTime();
  let ws = at(date, S.dayStart), we = at(date, S.dayEnd);
  const key = dkey(date);
  const blocks = [], allDay = [], covered = [];
  const totals = {}; let unassigned = 0;
  const titles = {};
  const add = (pid, min, title) => {
    if (min <= 0) return;
    if (!pid) { unassigned += min; return; }
    if (pid === 'ignore') return;
    totals[pid] = (totals[pid] || 0) + min;
    if (title) { titles[pid] = titles[pid] || {}; titles[pid][title] = (titles[pid][title] || 0) + min; }
  };

  for (const m of state.manual.filter((m) => m.date === key)) {
    const s = at(date, m.start), e = at(date, m.end);
    if (e <= s) continue;
    const eff = coverAdd(covered, s, e) / MIN;
    blocks.push({ kind: 'manual', s, e, pid: m.projectId || null, how: 'handmatig', title: m.note || 'Handmatig blok', ref: m, min: eff });
    add(m.projectId, eff, m.note);
  }

  const evs = calData.events
    .filter((ev) => ev.e > d0 && ev.s < d1 && !state.calendarsOff[ev.cal] && ev.status !== 3 && ev.mine !== 3 && !isBirthday(ev))
    .sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const weekday = date.getDay() >= 1 && date.getDay() <= 5;
  const allDayWork = [];
  const leaveDay = weekday && evs.some((ev) => ev.allDay && (proj(eventProject(ev).pid) || {}).fullDay);
  for (const ev of evs) {
    const { pid, how } = eventProject(ev);
    if (ev.allDay) {
      const p = proj(pid);
      const item = { kind: 'cal', ev, pid, how, title: ev.title || '(geen titel)', ref: ev, min: 0, s: ev.s, e: ev.e, allDay: true };
      allDay.push(item);
      if (p && p.fullDay) { item.min = weekday ? S.fullDayHours * 60 : 0; add(pid, item.min, ev.title); }
      else if (weekday && pid !== 'ignore' && !isPlaceholder(ev)) allDayWork.push(item); // vult de dag aan, zie hieronder
      continue;
    }
    if (ev.avail === 1 && !S.includeFree) continue;
    if (isPlaceholder(ev)) continue; // placeholder: de gemeten activiteit vult deze tijd
    const s = Math.max(ev.s, d0), e = Math.min(ev.e, d1);
    const eff = leaveDay ? 0 : coverAdd(covered, s, e) / MIN;
    blocks.push({ kind: 'cal', s, e, pid, how, title: ev.title || '(geen titel)', ref: ev, min: eff, leaveDay });
    add(pid, eff, ev.title);
  }

  // Hele-dag-werkafspraak (draaidag, showcase, trip): vult de dag aan tot een volle werkdag, naast wat er al gepland stond.
  const workAllDay = !leaveDay && allDayWork.length > 0;
  if (workAllDay) {
    let rest = Math.max(0, S.fullDayHours * 60 - (Object.values(totals).reduce((a, b) => a + b, 0) + unassigned));
    for (const item of allDayWork) { item.min = rest; rest = 0; add(item.pid, item.min, item.title); }
  }
  // Lange dagen: loopt een werkblok (draaidag, avondevent) buiten je werktijd, dan schuift de werktijd van die dag mee.
  for (const b of blocks) {
    if (!b.min || b.pid === 'ignore' || b.leaveDay) continue;
    ws = Math.min(ws, b.s); we = Math.max(we, b.e);
  }
  // Activiteit vult alleen de gaten tussen agenda- en handmatige blokken.
  const pieces = [];
  for (const seg of acts) {
    if (leaveDay || workAllDay || !(seg.e > d0 && seg.s < d1)) continue;
    for (const [s, e] of subtract(covered, Math.max(seg.s, d0), Math.min(seg.e, d1))) {
      if (e - s < 1000) continue;
      const mid = (s + e) / 2;
      const { pid, how } = segProject(seg);
      pieces.push({ s, e, seg, pid, how, outside: mid < ws || mid > we });
    }
  }
  pieces.sort((a, b) => a.s - b.s);
  const chunks = [];
  let cur = null;
  for (const p of pieces) {
    if (cur && p.s - cur.e <= S.chunkGap * MIN && overlapLen(covered, cur.e, p.s) === 0 && cur.outside === p.outside) {
      cur.pieces.push(p); cur.e = Math.max(cur.e, p.e);
    } else {
      cur = { pieces: [p], s: p.s, e: p.e, outside: p.outside };
      chunks.push(cur);
    }
  }
  for (const c of chunks) {
    const active = c.pieces.reduce((t, p) => t + (p.e - p.s), 0) / MIN;
    if (active < S.minChunk) continue;
    const factor = S.fillGaps ? ((c.e - c.s) / MIN) / active : 1;
    const by = {};
    let counted = 0;
    for (const p of c.pieces) {
      const counts = !c.outside || S.countOutside || p.how === 'handmatig';
      if (!counts) continue;
      const min = ((p.e - p.s) / MIN) * factor;
      by[p.pid || ''] = (by[p.pid || ''] || 0) + min;
      counted += min;
      add(p.pid, min, segLabel(p.seg).main);
    }
    const ranked = Object.entries(by).sort((a, b) => b[1] - a[1]);
    let pid = ranked.length ? ranked[0][0] || null : null;
    if (!ranked.length) {
      const anyPid = {}; for (const p of c.pieces) anyPid[p.pid || ''] = (anyPid[p.pid || ''] || 0) + (p.e - p.s);
      pid = Object.entries(anyPid).sort((a, b) => b[1] - a[1])[0][0] || null;
    }
    const labels = {};
    for (const p of c.pieces) { const l = p.seg.app; labels[l] = (labels[l] || 0) + (p.e - p.s); }
    const apps = Object.entries(labels).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    blocks.push({ kind: 'act', s: c.s, e: c.e, pid, how: '', title: apps.slice(0, 3).join(', '), pieces: c.pieces, min: counted, active, outside: c.outside, mixed: ranked.length > 1, by });
  }

  layoutLanes(blocks);
  const total = Object.values(totals).reduce((a, b) => a + b, 0);
  return { date, key, blocks, allDay, totals, unassigned, total, titles, ws, we };
}

function layoutLanes(blocks) {
  blocks.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const b of cluster) {
      let i = lanes.findIndex((end) => end <= b.s);
      if (i < 0) { i = lanes.length; lanes.push(0); }
      lanes[i] = b.e; b.lane = i;
    }
    for (const b of cluster) b.lanes = lanes.length;
  };
  for (const b of blocks) {
    if (b.s >= clusterEnd && cluster.length) { flush(); cluster = []; }
    cluster.push(b); clusterEnd = Math.max(clusterEnd, b.e);
  }
  if (cluster.length) flush();
}

function computeWeek() {
  weekData = computeWeekAt(week);
  return weekData;
}
function computeWeekAt(monday, acts = activity) {
  const days = [];
  for (let i = 0; i < 7; i++) days.push(computeDay(addDays(monday, i), acts));
  const totals = {}; let unassigned = 0;
  for (const d of days) {
    for (const [pid, m] of Object.entries(d.totals)) totals[pid] = (totals[pid] || 0) + m;
    unassigned += d.unassigned;
  }
  return { days, totals, unassigned, total: Object.values(totals).reduce((a, b) => a + b, 0) };
}

// ---------- Weergave: week ----------
const PX = 0.9; // pixels per minuut
let gridH0 = 8; // eerste uur in het weekraster, nodig om een muispositie om te rekenen naar een tijd
function renderWeek() {
  const S = state.settings;
  const nDays = S.weekend ? 7 : 5;
  const days = weekData.days.slice(0, nDays);
  const toH = (t) => { const [h, m] = t.split(':').map(Number); return h + (m || 0) / 60; };
  let h0 = Math.floor(toH(S.dayStart)), h1 = Math.ceil(toH(S.dayEnd));
  for (const d of days) for (const b of d.blocks) {
    h0 = Math.min(h0, new Date(b.s).getHours());
    const eh = (b.e - d.date.getTime()) / 36e5; h1 = Math.max(h1, Math.ceil(eh));
  }
  h0 = Math.max(0, h0); h1 = Math.min(24, Math.max(h1, h0 + 4));
  const height = (h1 - h0) * 60 * PX;
  const top = (ms, d) => ((ms - d.date.getTime()) / MIN - h0 * 60) * PX;

  const chips = Object.entries(weekData.totals).sort((a, b) => b[1] - a[1]).map(([pid, m]) => {
    const p = proj(pid);
    return `<span class="chip"><span class="sw" style="background:${projColor(pid)}"></span>${esc(p ? (p.nr ? p.nr + ' ' : '') + p.name : pid)} <b>${fmtHours(m / 60)}</b></span>`;
  }).join('');
  const unChip = weekData.unassigned > 1 ? `<span class="chip warn" id="jumpUn">Niet toegewezen <b>${fmtHours(weekData.unassigned / 60)}</b></span>` : '';
  let banner = '';
  if (!status.alive) banner = `<div class="banner">De meter draait niet. Agenda en activiteit worden pas bijgewerkt als Uren draait. <button class="btn sm" data-goto="instellingen">Hoe zet ik hem aan?</button></div>`;
  else if (status.agent && status.agent.calendar !== 'granted') banner = `<div class="banner">De meter heeft nog geen toegang tot je agenda. <button class="btn sm" data-goto="instellingen">Toestemming regelen</button></div>`;

  if (calData.calendars.length && !ownList().length) banner += `<div class="banner">Kies eerst welke agenda's van jou zijn, anders tellen ook gedeelde en privé-agenda's mee. <button class="btn sm" data-goto="instellingen">Agenda's kiezen</button></div>`;
  const openQ = (state.questions || []).filter((q) => q.status !== 'beantwoord');
  if (openQ.length) banner += `<div class="banner">${openQ.length} ${openQ.length === 1 ? 'vraag' : 'vragen'} aan ${esc(state.settings.askName)} staan open. Tot er antwoord is, wordt daar niets automatisch op toegewezen. <button class="btn sm" data-act="openQuestions">Bekijk</button></div>`;
  const todayKey = dkey(new Date());
  let html = `${banner}<div class="summary"><span class="chip total">Totaal <b>${fmtHours(weekData.total / 60)}</b></span>${chips}${unChip}</div>`;
  html += `<div class="card grid" style="grid-template-columns:54px repeat(${nDays}, 1fr)">`;
  html += `<div class="dayhead" style="border-left:0"></div>`;
  days.forEach((d, i) => {
    const allDays = d.allDay.map((b, j) => `<div class="allday" data-b="${i}:a${j}" style="border-left-color:${b.pid ? projColor(b.pid) : 'var(--unassigned)'}" title="${esc(b.title)}">${esc(b.title)}${b.min ? ' · ' + fmtHours(b.min / 60) + 'u' : ''}</div>`).join('');
    html += `<div class="dayhead"><div class="d ${d.key === todayKey ? 'today' : ''}">${DAYS[i]} ${d.date.getDate()} ${MONTHS[d.date.getMonth()]}</div>
      <div class="tot">${fmtHours(d.total / 60)} u${d.unassigned > 1 ? ` · <span class="open">${fmtHours(d.unassigned / 60)} open</span>` : ''}</div>
      <button class="btn ghost sm add" data-add="${d.key}" title="Handmatig blok toevoegen">＋</button>
      ${allDays ? `<div class="alldays">${allDays}</div>` : ''}</div>`;
  });
  html += `<div class="gutter" style="height:${height}px">`;
  for (let h = h0 + 1; h < h1; h++) html += `<div class="h" style="top:${(h - h0) * 60 * PX}px">${pad(h)}:00</div>`;
  html += `</div>`;
  gridH0 = h0;
  days.forEach((d, i) => {
    html += `<div class="col" data-col="${d.key}" style="height:${height}px">`;
    html += `<div class="work" style="top:${top(d.ws, d)}px;height:${(d.we - d.ws) / MIN * PX}px"></div>`;
    for (let h = h0 + 1; h < h1; h++) html += `<div class="hl" style="top:${(h - h0) * 60 * PX}px"></div>`;
    if (d.key === todayKey) html += `<div class="now" style="top:${top(Date.now(), d)}px"></div>`;
    d.blocks.forEach((b, j) => {
      const t = top(b.s, d), hgt = Math.max(14, (b.e - b.s) / MIN * PX - 2);
      const w = 100 / b.lanes;
      const cls = ['blk', b.kind === 'act' ? 'act' : '', !b.pid ? 'un' : '', b.pid === 'ignore' ? 'ign' : '', (b.outside && !b.min) || b.leaveDay ? 'out' : ''].join(' ');
      const bg = b.pid && b.pid !== 'ignore' ? `background:${b.kind === 'act' ? `color-mix(in srgb, ${projColor(b.pid)} 38%, var(--panel));color:var(--ink)` : projColor(b.pid) + 'dd'};border-color:${projColor(b.pid)}` : '';
      const p = proj(b.pid);
      const tag = b.kind === 'act' ? 'activiteit' : b.kind === 'manual' ? 'handmatig' : '';
      const meta = `${fmtTime(b.s)}-${fmtTime(b.e)}${p && p.nr ? ' · ' + p.nr : ''}${b.kind === 'act' ? ' · ' + hm(b.min) : ''}`;
      const man = b.kind === 'manual' ? ` man" data-mid="${b.ref.id}` : '';
      html += `<div class="${cls}${man}" data-b="${i}:${j}" style="top:${t}px;height:${hgt}px;left:calc(${b.lane * w}% + 2px);width:calc(${w}% - 4px);${bg}" title="${esc(b.title)}">
        <div class="t">${tag ? `<span class="tag">${tag}</span>` : ''}${esc(b.title)}</div>${hgt > 26 ? `<div class="m">${meta}</div>` : ''}${b.kind === 'manual' ? '<div class="resz" title="Sleep om de eindtijd te wijzigen"></div>' : ''}</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  if (!calData.events.length && !activity.length) html += `<p class="muted small" style="margin-top:12px">Nog geen agenda of activiteit voor deze week. Zodra de meter loopt en toegang heeft, verschijnt hier alles vanzelf.</p>`;
  return html;
}

function addKeyword(pid, kw) {
  kw = String(kw || '').trim().replace(/,/g, ' ');

  if (!p || kw.length < 2) return;
  if (kwList(p).includes(kw.toLowerCase())) return;
  p.keywords = (p.keywords ? p.keywords.replace(/[,\s]+$/, '') + ', ' : '') + kw;
  toast(`Regel toegevoegd aan ${p.nr || p.name}: "${kw}"`);
}

function actGroups(b) {
  const groups = {};
  for (const p of b.pieces) {
    const l = segLabel(p.seg);
    const g = groups[l.key] || (groups[l.key] = { ...l, min: 0, pieces: [], pids: {} });
    g.min += (p.e - p.s) / MIN;
    g.pieces.push(p);
    g.pids[p.pid || ''] = (g.pids[p.pid || ''] || 0) + 1;
  }
  return Object.values(groups).sort((a, b) => b.min - a.min).map((g) => ({ ...g, pid: Object.entries(g.pids).sort((a, b) => b[1] - a[1])[0][0] || '' }));
}

    </div>`);

function addMinutes(hhmm, n) { const [h, m] = hhmm.split(':').map(Number); const t = Math.min(24 * 60 - 1, h * 60 + m + n); return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; }

// ---------- Voorstellen ----------
// Stelt projecten voor op basis van titel, klant, aanvangsdatum in AFAS, je eigen projectlijst en je Slack-activiteit die dag.
// Er wordt niets toegepast: pas een klik wijst toe.
const ALIASES = [[/\bh7\b/g, 'healthy 7'], [/healthy7/g, 'healthy 7'], [/post ?nl/g, 'postnl'], [/kempenh\w*/g, 'kempenhaeghe'], [/\bsgc\b/g, 'sports gift card'], [/4 ?daagse/g, '4daagse'], [/destap|de stap/g, 'stap'], [/eten (en|&|\+) ?welzijn/g, 'eten+welzijn']];
const STOP = new Set('voor met van het een de en in op aan bij naar over uit prep voorbereiding voorbereiden meeting call check incheck update blok werkblok focusblok studio opnames opname training gear care gearcare locatie bezoek draaidag nieuwe activiteit doorloop overleg intern online digitaal fysiek planning concept bespreking vervolg afbouw opbouw reservering uitloop'.split(' '));
const GENERIC = new Set('video videos campagne campagnes content digitale ontwikkeling aflevering project projecten werkzaamheden marketing 2024 2025 2026 2027 techonomy intern'.split(' '));
const normText = (t) => { let x = String(t || '').toLowerCase(); for (const [re, to] of ALIASES) x = x.replace(re, to); return x; };
const words = (t) => normText(t).split(/[^a-z0-9+&]+/).filter((w) => w.length >= 3 && !STOP.has(w));
function catDate(c) { const m = String(c.start || '').match(/(\d{2})-(\d{2})-(\d{4})/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
function slackText(dateKey) {
  const d = (slackCtx.dagen || {})[dateKey];
  return d ? normText(d.kanalen.map((k) => k.kanaal + ' ' + k.onderwerp).join(' ')) : '';
}
function suggest(title, date, limit = 3) {
  const ws = words(title).filter((w) => !GENERIC.has(w));
  if (!ws.length) return [];
  const own = new Set(state.projects.map((p) => p.nr).filter(Boolean));
  const dk = dkey(date);
  const sl = slackText(dk);
  const around = (n) => { let t = ''; for (let i = -n; i <= n; i++) if (i) t += ' ' + slackText(dkey(addDays(date, i))); return t; };
  const sl3 = around(3), sl14 = around(14);
  const out = [];
  for (const c of catalog) {
    const name = normText(c.name), client = normText(c.client);
    let score = 0;
    for (const w of ws) { if (name.includes(w)) score += 3; else if (client.includes(w)) score += 2; }
    if (!score) continue;
    const why = [];
    const st = catDate(c);
    if (st) {
      const days = (date - st) / 864e5;
      if (days < -45) continue; // project bestond toen nog lang niet
      if (days < 0) why.push('in AFAS aangemaakt op ' + c.start); // uren worden vaak met terugwerkende kracht geschreven
      else if (days <= 365) { score += Math.max(0, 3 - days / 45); why.push('aanvang ' + c.start); }
      else score -= 1;
    }
    if (own.has(c.nr)) { score += 2; why.push('in je lijst'); }
    const mine = state.projects.find((p) => p.nr === c.nr);
    const specific = [...new Set(words(c.name).concat(mine ? kwList(mine).map(normText) : []))].filter((w) => w.length >= 5 && !GENERIC.has(w) && !client.includes(w));
    let hit;
    if ((hit = specific.find((w) => sl.includes(w)))) { score += 4; why.push('Slack die dag: ' + hit); }
    else if ((hit = specific.find((w) => sl3.includes(w)))) { score += 2; why.push('Slack die week: ' + hit); }
    else if ((hit = specific.find((w) => sl14.includes(w)))) { score += 1; why.push('Slack in die periode: ' + hit); }
    out.push({ nr: c.nr, name: c.name, client: c.client, score: Math.round(score * 10) / 10, why });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, limit);
}
function noteRecent(pid) {
  if (!pid || pid === 'ignore') return;
  state.recent = [pid].concat((state.recent || []).filter((x) => x !== pid)).slice(0, 12);
}
function ensureProject(nr) {
  nr = String(nr || '').trim();
  let p = state.projects.find((x) => x.nr === nr);
  if (p) return p;
  const c = catalog.find((x) => x.nr === nr);
  if (!c) return null;
  p = { id: 'p' + nr, nr, name: c.name, admin: c.client, werksoort: state.settings.defaultWerksoort || 'VIDEO', color: PALETTE[state.projects.length % PALETTE.length], keywords: '', fullDay: false, active: true, source: 'catalog' };
  state.projects.splice(state.projects.length - 1, 0, p);
  return p;
}
function suggestButtons(list, attrs) {
  if (!list.length) return '<div class="small muted">Geen voorstel gevonden. Typ hieronder een AFAS-nummer.</div>';
  return list.map((sg, i) => `<button class="btn sm ${i === 0 ? 'primary' : ''}" style="text-align:left;white-space:normal;margin:0 6px 6px 0" data-act="pickSuggest" data-nr="${sg.nr}" ${attrs}><b class="mono">${sg.nr}</b> ${esc(sg.name)}<div class="small" style="opacity:.75">${esc(sg.why.join(' · ') || sg.client)}</div></button>`).join('');
}
const nrInput = (attrs) => `<div style="margin-top:4px"><div class="row"><input type="search" autocomplete="off" placeholder="Zoek op AFAS-nr of projectnaam" data-nrinput ${attrs}><button class="btn sm" data-act="pickNr" ${attrs} style="flex:0">Toewijzen</button></div><div class="small muted" data-nrhint style="margin-top:3px"></div><div class="nrresults" data-nrresults></div></div>`;
function searchCatalog(q, limit = 8) {
  const ws = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!ws.length) return [];
  const own = new Set(state.projects.map((p) => p.nr).filter(Boolean));
  return catalog.filter((c) => { const h = (c.nr + ' ' + c.name + ' ' + c.client).toLowerCase(); return ws.every((w) => h.includes(w)); })
    .sort((a, b) => (own.has(b.nr) - own.has(a.nr)) || ((catDate(b) || 0) - (catDate(a) || 0))).slice(0, limit)
    .map((c) => ({ ...c, own: own.has(c.nr) }));
}
const nrFrom = (v) => (String(v || '').match(/\b\d{6}\b/) || [''])[0];
// Eén zoeklijst voor alle AFAS-projecten: eerst je eigen projecten, daarna de nieuwste.
function renderCatList() {
  let dl = document.getElementById('catList');
  if (!dl) { dl = document.createElement('datalist'); dl.id = 'catList'; document.body.appendChild(dl); }

function pickFor(scope, nr) {
  nr = String(nr || '').trim();
  if (!/^\d{6}$/.test(nr)) return toast('Kies een project uit de lijst of typ een AFAS-nummer van 6 cijfers');
  if (scope === 'cal') {
    if (assignEvents([drawerCtx.b.ref], nr)) { closeDrawer(); render(); }
    return;
  }
  if (scope === 'manual') {
    const p = ensureProject(nr);
    if (!p) return toast(`Nummer ${nr} niet gevonden in de AFAS-catalogus`);
    const sel = document.getElementById('mProj');
    if (![...sel.options].some((o) => o.value === p.id)) sel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${esc(p.nr)} ${esc(p.name)}</option>`);
    sel.value = p.id;
    if (drawerCtx.isNew) return toast(`${p.nr} gekozen. Klik Opslaan om het blok toe te voegen.`);
    saveManual(); toast(`Blok toegewezen aan ${p.nr} ${p.name}`);
    return;
  }
  if (scope === 'act') {
    const p = ensureProject(nr);
    if (!p) return toast(`Nummer ${nr} niet gevonden in de AFAS-catalogus`);
    assignPieces(drawerCtx.b.pieces, p.id); noteRecent(p.id);
    save(); closeDrawer(); render(); toast(`Blok toegewezen aan ${p.nr} ${p.name}`);
    return;
  }
  const u = drawerCtx.unknown;
  const evs = scope === 'all' ? u.occ.map((o) => o.ev) : [u.occ[+scope].ev];
  if (!assignEvents(evs, nr)) return;
  render();
  const fresh = catchupData().unknown.find((x) => x.title.toLowerCase() === u.title.toLowerCase());
  if (fresh) openUnknownDrawer(fresh); else closeDrawer();
}
function assignEvents(evs, nr) {
  const p = ensureProject(nr);

  for (const ev of evs) state.assign['ev:' + ev.id] = p.id;
  noteRecent(p.id);
  save(); toast(`${evs.length > 1 ? evs.length + ' afspraken' : 'Afspraak'} toegewezen aan ${p.nr} ${p.name}`);

}

let catchupActs = null, catchupKey = '';
async function loadCatchupActivity() {
  const from = parseKey(state.settings.catchupFrom || dkey(addDays(week, -28)));
  const key = dkey(from) + '|' + dkey(new Date());
  if (catchupKey === key && catchupActs) return;
  catchupActs = await api(`/api/activity?from=${dkey(from)}&to=${dkey(new Date())}`);
  catchupActs.sort((a, b) => a.s - b.s);
  catchupKey = key;
}
function catchupData() {
  const S = state.settings;
  const from = S.catchupFrom ? parseKey(S.catchupFrom) : addDays(mondayOf(new Date()), -28);
  const weeks = [], unknown = {};
  for (let m = mondayOf(from); m <= new Date(); m = addDays(m, 7)) {
    const wd = computeWeekAt(m, catchupActs || []);
    let leave = 0, fixed = 0, open = 0, days = 0;
    wd.days.slice(0, 5).forEach((d) => {
      if (d.date < from || d.date > new Date()) return;
      days++;
      for (const [pid, min] of Object.entries(d.totals)) { if ((proj(pid) || {}).fullDay) leave += min; else fixed += min; }
      open += d.unassigned;
      for (const b of d.blocks.concat(d.allDay)) {
        if (b.kind !== 'cal' || b.pid || b.leaveDay || !b.min) continue;
        const t = b.title.trim();
        const u = unknown[t.toLowerCase()] || (unknown[t.toLowerCase()] = { title: t, min: 0, n: 0, dates: [], occ: [] });
        u.min += b.min; u.n++; if (!u.dates.includes(d.key)) u.dates.push(d.key);
        u.occ.push({ ev: b.ref, date: d.key, min: b.min, slack: slackSummary(d.key) });
      }
    });
    const target = (S.weekHours / 5) * days * 60;
    weeks.push({ monday: m, wd, leave, fixed, open, target, rest: Math.max(0, target - leave - fixed - open), done: !!state.reported[(() => { const w = isoWeek(m); return `${w.year}-W${pad(w.week)}`; })()] });
  }
  return { weeks, unknown: Object.values(unknown).sort((a, b) => b.min - a.min) };
}

function reportRows() {

    for (const d of weekData.days) for (const [t, m] of Object.entries(d.titles[pid] || {})) titles[t] = (titles[t] || 0) + m;

    rows.push({ pid, p, days, total: days.reduce((a, b) => a + b, 0), raw: weekData.totals[pid] / 60, desc });

// ---------- AFAS-export: afgesloten weken sluitend maken ----------
// De echte uren blijven in de app. Alleen in de export wordt een tekort tot de weeknorm aangevuld met 000753 Overige werkzaamheden.
const fillNr = () => String(state.settings.fillNr || '000753').trim();
function exportRows(rows) {
  const S = state.settings;
  const target = Number(S.weekHours) || 40, perDay = Number(S.fullDayHours) || 8;
  const out = rows.map((r) => ({ ...r, days: r.days.slice(), fill: 0 }));
  const dayTot = (i) => out.reduce((t, r) => t + r.days[i], 0);
  let deficit = Math.max(0, target - out.reduce((t, r) => t + r.days.reduce((a, b) => a + b, 0), 0));
  const fill = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 0; i < 5 && deficit > 0.001; i++) {
    const add = Math.min(deficit, Math.max(0, perDay - dayTot(i)));
    fill[i] = roundH(add); deficit -= fill[i];
  }
  // Blijft er na het opvullen tot 8 uur per dag nog iets over (bijv. door afronding), dan op de laatste werkdag.
  if (deficit > 0.001) fill[4] += roundH(deficit);
  const fillTotal = fill.reduce((a, b) => a + b, 0);
  if (fillTotal > 0) {
    const p = state.projects.find((x) => x.nr === fillNr()) || ensureProject(fillNr());
    let row = out.find((r) => r.p.nr === fillNr());
    if (!row) { row = { pid: p.id, p, days: [0, 0, 0, 0, 0, 0, 0], total: 0, desc: '' }; out.push(row); }
    row.fill = fillTotal;
    row.days = row.days.map((h, i) => h + fill[i]);
    row.total = row.days.reduce((a, b) => a + b, 0);
    out.sort((a, b) => (a.p.nr || 'zzz').localeCompare(b.p.nr || 'zzz'));
  }
  return { rows: out, fill, fillTotal, target };
}
function renderExport(rows, closed) {
  const wk = isoWeek(week).week;
  if (!closed) {
    return `<div class="card section"><h2>AFAS-export week ${wk}</h2><p class="muted" style="margin:0 0 12px">De export maakt de week sluitend: komt je week onder de ${state.settings.weekHours} uur, dan wordt het tekort aangevuld met ${fillNr()} Overige werkzaamheden. Dat gebeurt alleen voor weken die je zelf hebt afgesloten; in de app blijven je echte uren staan.</p><button class="btn primary" data-act="toggleClosed">Week ${wk} afsluiten</button></div>`;
  }
  const ex = exportRows(rows);
  storeExport(ex);
  const showDays = ex.rows.some((r) => r.days[5] || r.days[6]) ? 7 : 5;
  const dayTotals = [0, 1, 2, 3, 4, 5, 6].map((i) => ex.rows.reduce((t, r) => t + r.days[i], 0));
  const grand = dayTotals.reduce((a, b) => a + b, 0);
  let html = `<div class="card section"><div class="row" style="align-items:flex-start;flex-wrap:wrap;gap:12px">
    <div style="flex:2"><h2>AFAS-export week ${wk}</h2><div class="muted small">Afgesloten op ${new Date(closed).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' })}. ${ex.fillTotal ? `Aangevuld met ${fmtNum(ex.fillTotal)} uur ${fillNr()} om op ${ex.target} uur te komen.` : `Deze week heeft al ${fmtNum(grand)} uur, er is niets aangevuld.`}</div></div>

// ---------- Invullen in AFAS (bladwijzer) ----------
// Draait in de AFAS-urenmatrix, in je eigen ingelogde browser. Haalt de export van de getoonde week op uit de uren-app,
// vult alleen lege vakjes, laat afwijkende waarden staan en toont een overzicht. Opslaan doe je zelf in AFAS.
async function afasFill(dry) {
  const BASE = 'http://127.0.0.1:5230';
  const deep = (root, sel, out = []) => { root.querySelectorAll('*').forEach((e) => { if (e.matches(sel)) out.push(e); if (e.shadowRoot) deep(e.shadowRoot, sel, out); }); return out; };
  const old = document.getElementById('uren-fill-panel'); if (old) old.remove();
  const panel = document.createElement('div');
  panel.id = 'uren-fill-panel';
  panel.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:2147483647;width:380px;max-height:70vh;overflow:auto;background:#fff;color:#11152a;border:1px solid #dfe8e8;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,49,.18);padding:14px 16px;font:14px/1.45 Montserrat,system-ui,sans-serif';
  const show = (html) => { panel.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="color:#000031">Uren invullen${dry ? ' (proef)' : ''}</b><button id="uren-fill-x" style="border:0;background:none;font-size:16px;cursor:pointer">✕</button></div>` + html; document.body.appendChild(panel); panel.querySelector('#uren-fill-x').onclick = () => panel.remove(); return panel; };
  // De matrix staat in shadow DOM; innerText ziet die niet (en toont soms een oude week). Lees de zichtbare kop.
  const allLeaves = deep(document, '*').filter((e) => e.children.length === 0 && e.getBoundingClientRect().width > 0);
  const monLeaf = allLeaves.find((e) => e.textContent.trim() === 'Maandag');
  const calLeaf = allLeaves.find((e) => /^(JANUARI|FEBRUARI|MAART|APRIL|MEI|JUNI|JULI|AUGUSTUS|SEPTEMBER|OKTOBER|NOVEMBER|DECEMBER)\s+\d{4}$/.test(e.textContent.trim()));
  const text = (monLeaf ? monLeaf.parentElement.textContent.replace(/\s+/g, ' ') : '') + ' ' + (calLeaf ? calLeaf.textContent : '');
  const MON = { JAN: 0, FEB: 1, MRT: 2, APR: 3, MEI: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OKT: 9, NOV: 10, DEC: 11 };
  const md = text.match(/Maandag\s*(\d{1,2})\s*(JAN|FEB|MRT|APR|MEI|JUN|JUL|AUG|SEP|OKT|NOV|DEC)/);
  if (!md) return show('Open eerst je urenmatrix in AFAS (Uren boeken per week) en kies de week.');
  const LONG = ['JANUARI', 'FEBRUARI', 'MAART', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AUGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DECEMBER'];
  const ym = text.match(/(JANUARI|FEBRUARI|MAART|APRIL|MEI|JUNI|JULI|AUGUSTUS|SEPTEMBER|OKTOBER|NOVEMBER|DECEMBER)\s+(\d{4})/);
  let year = ym ? +ym[2] : new Date().getFullYear();
  const calMonth = ym ? LONG.indexOf(ym[1]) : MON[md[2]];
  if (MON[md[2]] - calMonth > 6) year -= 1; if (calMonth - MON[md[2]] > 6) year += 1;
  const p2 = (n) => String(n).padStart(2, '0');
  const monday = `${year}-${p2(MON[md[2]] + 1)}-${p2(+md[1])}`;
  let ex;
  try { ex = await fetch(`${BASE}/api/afas-export?monday=${monday}`).then((r) => r.json()); }
  catch { return show('De uren-app is niet bereikbaar. Staat de meter aan (⏱ in de menubalk)? Chrome kan ook om toestemming voor het lokale netwerk vragen: klik dan Toestaan.'); }
  if (!ex.ok) return show(`Week van maandag ${md[1]} ${md[2].toLowerCase()} is nog niet afgesloten in de uren-app. Sluit hem af in het AFAS-rapport en probeer opnieuw.`);
  // Matrix uitlezen: dagkoppen op x, projectregels op y.
  const leaves = deep(document, '*').filter((e) => e.children.length === 0);
  const DAYN = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
  const heads = leaves.filter((e) => DAYN.includes(e.textContent.trim())).map((e) => { const r = e.getBoundingClientRect(); return { i: DAYN.indexOf(e.textContent.trim()), x: r.left + r.width / 2 }; });
  const labels = leaves.filter((e) => /^\d{6}$/.test(e.textContent.trim())).map((e) => ({ nr: e.textContent.trim(), y: e.getBoundingClientRect().top })).sort((a, b) => a.y - b.y);
  const cells = {};
  for (const inp of deep(document, 'input')) {
    const r = inp.getBoundingClientRect();
    if (!r.width || (r.left + r.width / 2) < (Math.min(...heads.map((h) => h.x)) - 100)) continue;
    const lab = [...labels].reverse().find((l) => l.y <= r.top + 2);
    const h = heads.reduce((b, x) => (Math.abs(x.x - (r.left + r.width / 2)) < Math.abs(b.x - (r.left + r.width / 2)) ? x : b), heads[0]);
    if (lab && h && Math.abs(h.x - (r.left + r.width / 2)) < 70 && !cells[lab.nr + '|' + h.i]) cells[lab.nr + '|' + h.i] = inp;
  }
  const toHM = (x) => { const m = Math.round(x * 60); return `${Math.floor(m / 60)}:${p2(m % 60)}`; };
  const toNum = (v) => { v = String(v || '').trim(); if (!v) return 0; if (v.includes(':')) { const [a, b] = v.split(':'); return +a + (+b || 0) / 60; } return parseFloat(v.replace(',', '.')) || 0; };
  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
  const filled = [], same = [], conflict = [], missing = new Set(), hidden = [];
  for (const row of ex.rows) {
    row.days.forEach((hrs, i) => {
      if (!hrs) return;
      const inp = cells[row.nr + '|' + i];
      if (!inp) { if (!labels.some((l) => l.nr === row.nr)) missing.add(row.nr + ' ' + row.name); else hidden.push(`${row.nr} ${DAYN[i]}`); return; }
      const cur = toNum(inp.value);
      if (cur && Math.abs(cur - hrs) < 0.01) { same.push(row.nr); return; }
      if (cur) { conflict.push(`${row.nr} ${DAYN[i].slice(0, 2)}: staat ${inp.value}, export ${toHM(hrs)}`); inp.style.outline = '2px solid #d4145a'; return; }
      if (dry) { inp.style.outline = '2px solid #ff4600'; filled.push(`${row.nr} ${DAYN[i].slice(0, 2)} ${toHM(hrs)}`); return; }
      inp.focus(); setter.call(inp, toHM(hrs));
      inp.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
      inp.blur();
      inp.style.outline = '2px solid #17735b';
      filled.push(`${row.nr} ${DAYN[i].slice(0, 2)} ${toHM(hrs)}`);
    });
  }
  const total = ex.rows.reduce((t, r) => t + r.days.reduce((a, b) => a + b, 0), 0);
  const list = (title, arr, color) => (arr.length ? `<div style="margin-top:8px"><b style="color:${color}">${title} (${arr.length})</b><div style="font-size:12px;color:#68717d">${arr.join('<br>')}</div></div>` : '');
  show(`<div style="font-size:12px;color:#68717d">Week van maandag ${md[1]} ${md[2].toLowerCase()} ${year} · export ${toHM(total)} uur</div>`
    + list(dry ? 'Zou invullen' : 'Ingevuld', filled, '#17735b')
    + list('Stond al goed', [...new Set(same)], '#68717d')
    + list('Niet aangepast, wijkt af', conflict, '#d4145a')
    + list('Project staat nog niet in je matrix: voeg de regel toe en klik opnieuw', [...missing], '#ff4600')
    + list('Weekend niet zichtbaar: zet "Toon weekend" aan', hidden, '#ff4600')
    + `<div style="margin-top:10px;font-size:12px">${dry ? 'Er is niets veranderd.' : 'Controleer de vakjes en sla op in AFAS. Er is nog niets opgeslagen.'}</div>`);
  return { filled, same, conflict, missing: [...missing], hidden };
}

function tableText(sep) {
  const rows = reportRows();
  const head = ['Projectnr', 'Project', 'Relatie', 'Werksoort', ...weekData.days.map((d, i) => `${DAYS[i]} ${dkey(d.date)}`), 'Totaal', 'Omschrijving'];

  return lines.join('\n');
}

function importPaste() {
  const lines = document.getElementById('pasteBox').value.split('\n').map((l) => l.replace(/^[\s▾▸▼►•-]+/, '').trim()).filter(Boolean);
  let last = null, added = 0, updated = 0;
  for (const line of lines) {
    const m = line.match(/^(\d{3,})\s+(.+?)(?:\s+[•·|]\s+(.+))?$/);
    if (m) {
      let p = state.projects.find((x) => x.nr === m[1]);
      if (p) { p.name = m[2]; if (m[3]) p.admin = m[3]; updated++; }
      else {
        p = { id: 'p' + m[1], nr: m[1], name: m[2], admin: m[3] || '', werksoort: '', color: PALETTE[state.projects.length % PALETTE.length], keywords: '', fullDay: false, active: true };
        state.projects.splice(state.projects.length - 1, 0, p); added++;
      }
      last = p;
    } else if (last && !last.werksoort) {
      last.werksoort = line.split(/\s+/)[0];
    }
  }
  save(); closeDrawer(); render(); toast(`${added} toegevoegd, ${updated} bijgewerkt`);
}

function koppelingenCard() {
  const S = state.settings, a = status.agent;
  const sources = [...new Set(calData.calendars.map((c) => c.source).filter(Boolean))];
  const own = ownList();
  const meter = status.alive && a
    ? `Draait. Agenda: ${a.calendar === 'granted' ? `toegang, ${a.calendarEvents} afspraken` : 'nog geen toegang (klik Sta toe, of zet "Uren" aan bij Privacy › Agenda’s)'}. Toegankelijkheid: ${a.accessibility ? 'aan' : 'uit (zet Uren aan bij Privacy › Toegankelijkheid)'}.`

      <div class="grid3"><div class="field" style="margin:0"><label>Vaste posten (AFAS-nrs)</label><input type="text" data-sf="quickNrs" value="${esc(S.quickNrs || '')}"></div>
      <div class="field" style="margin:0"><label>Aanvulpost</label><input type="text" data-sf="fillNr" value="${esc(S.fillNr || '')}"></div>
      <div class="field" style="margin:0"><label>Standaard werksoort</label><input type="text" data-sf="defaultWerksoort" value="${esc(S.defaultWerksoort || '')}"></div></div>`)}

      ? `App ${esc(status.appVersion)}, schermen ${esc(status.webVersion || PAGE_VERSION)}. Kleine aanpassingen worden vanaf dit adres opgehaald (bij het starten en elke 6 uur); de app zelf hoeft daarvoor niet opnieuw geïnstalleerd te worden.
        <div class="row" style="margin-top:8px"><input type="text" data-sf="updateUrl" value="${esc(S.updateUrl || '')}" placeholder="https://… /index.html"><button class="btn sm" data-act="checkUpdate" style="flex:0">Nu controleren</button></div>
        <div class="small muted" style="margin-top:4px" id="updateResult">${esc(status.updateResult || '')}</div>`
      : `Schermen ${esc(PAGE_VERSION)}. Automatische updates werken in de Mac-app Uren (DMG).`)}
    ${kstep(canAsk() ? true : null, '7. Collega voor vragen (optioneel)', `Als je niet weet op welk project iets hoort, zet de app een Slack-bericht voor deze collega klaar.
      <div class="grid3"><div class="field" style="margin:0"><label>Naam</label><input type="text" data-sf="askName" value="${esc(S.askName || '')}" placeholder="bijv. Irene"></div>

      <h3 style="margin-top:16px">Installeren en toestemming</h3>

    <div class="card section"><h2>Rekenregels</h2>
      <div class="row"><div class="field"><label>Werkdag begint</label><input type="time" data-sf="dayStart" value="${S.dayStart}"></div><div class="field"><label>Werkdag eindigt</label><input type="time" data-sf="dayEnd" value="${S.dayEnd}"></div></div>
      <div class="row"><div class="field"><label>Afronden per dag per project</label><select data-sf="rounding">${[[0.25, 'Kwartier (0,25)'], [0.5, 'Half uur (0,5)'], [0.1, 'Tiende uur (0,1)'], [0, 'Niet afronden']].map(([v, l]) => `<option value="${v}" ${Number(S.rounding) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

  html += `</div><div class="card section"><h2>Back-up</h2><p class="small muted" style="margin-top:0">Projecten, regels en toewijzingen worden ook dagelijks automatisch geback-upt in de datamap.</p>
    <div class="actions"><button class="btn" data-act="exportState">Exporteer instellingen</button><label class="btn">Importeer…<input type="file" id="importFile" accept="application/json" hidden></label></div></div>`;
