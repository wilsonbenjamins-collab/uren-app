}

// ---------- Events ----------
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-b],[data-openweek],[data-unkopen],[data-add],[data-act],[data-goto],[data-copy],[data-copyrow],[data-delproj],#jumpUn,#agentPill');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; closeDrawer(); render(); return; }
  if (t.dataset.goto) { tab = t.dataset.goto; render(); return; }
  if (t.id === 'agentPill') { tab = 'instellingen'; render(); return; }
  if (t.id === 'jumpUn') { const el = document.querySelector('.blk.un'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.click(); } return; }
  if (t.dataset.b) { openBlock(t.dataset.b); return; }
  if (t.dataset.unkopen !== undefined) { e.preventDefault(); openUnknownDrawer(catchupData().unknown[+t.dataset.unkopen]); return; }
  if (t.dataset.openweek) { tab = 'week'; gotoWeek(parseKey(t.dataset.openweek)); return; }
  if (t.dataset.add) { openManualDrawer(null, t.dataset.add); return; }
  if (t.dataset.copy !== undefined) { copyText(t.dataset.copy, `Gekopieerd: ${t.dataset.copy || '(leeg)'}`); return; }
  if (t.dataset.copyrow) {
    const r = reportRows().find((x) => x.pid === t.dataset.copyrow);
    if (r) copyText([r.p.nr, ...r.days.map(fmtNum)].join('\t'), `Rij ${r.p.nr} gekopieerd`);
    return;
  }
  if (t.dataset.delproj) {
    const p = proj(t.dataset.delproj);
    if (p && confirm(`Project ${p.nr} ${p.name} verwijderen? Toegewezen uren worden dan weer "niet toegewezen".`)) {
      state.projects = state.projects.filter((x) => x !== p); save(); render();
    }
    return;
  }
  const act = t.dataset.act;
  const actions = {
    saveCal, resetCal, assignAll, addRule, saveManual, deleteManual, importPaste, askBlock, openQuestions,
    pickSuggest: () => pickFor(t.dataset.scope, t.dataset.nr),
    checkUpdate: async () => {
      const el = document.getElementById('updateResult'); if (el) el.textContent = 'Controleren…';
      try { const r = await api('/api/update-check', { method: 'POST' }); if (el) el.textContent = r.result; await loadStatus(); }
      catch { if (el) el.textContent = 'Controleren lukte niet'; }
    },
    importRows: () => {
      const rows = ((afasTabInfo.tab || {}).rows || []).filter((r) => !state.projects.some((p) => p.nr === r.nr));
      for (const r of rows) {
        const c = catalog.find((x) => x.nr === r.nr) || {};
        state.projects.splice(state.projects.length - 1, 0, { id: 'p' + r.nr, nr: r.nr, name: r.name || c.name || r.nr, admin: r.relatie || c.client || '', werksoort: r.werksoort || state.settings.defaultWerksoort || 'VIDEO', color: PALETTE[state.projects.length % PALETTE.length], keywords: '', fullDay: false, active: true, source: 'afas-matrix' });
      }
      save(); render(); toast(`${rows.length} projecten geïmporteerd uit AFAS`);
    },
    ignoreUnknown: () => {
      const u = drawerCtx.unknown;
      for (const o of u.occ) state.assign['ev:' + o.ev.id] = 'ignore';
      save(); closeDrawer(); render(); toast(`"${u.title}" telt niet meer mee`);
    },
    overtime: () => {
      const b = drawerCtx.b, ev = b.ref;
      const pid = document.getElementById('cProj').value || b.pid || '';
      if (!pid) return toast('Kies eerst het project van deze afspraak');
      const start = new Date(ev.e), end = new Date(ev.e + Number(t.dataset.h) * 36e5);
      const sameDay = dkey(start) === dkey(end);
      state.manual.push({ id: uid(), date: dkey(start), start: fmtTime(ev.e), end: sameDay ? fmtTime(end.getTime()) : '23:59', projectId: pid, note: 'Uitloop ' + (ev.title || '').trim() });
      save(); closeDrawer(); render(); toast(`Uitloop tot ${sameDay ? fmtTime(end.getTime()) : '23:59'} toegevoegd`);
    },
    pickNr: () => { const inp = document.querySelector(`[data-nrinput][data-scope="${t.dataset.scope}"]`); pickFor(t.dataset.scope, nrFrom(inp && inp.value)); },
    askUnknownOne: () => {
      const u = drawerCtx.unknown;
      const text = `"${u.title}" (${u.dates.slice(0, 4).map((k) => { const d = parseKey(k); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }).join(', ')}, ${fmtHours(u.min / 60)} uur): op welk AFAS-project schrijf ik dit?`;
      if (!state.questions.some((q) => q.text === text)) state.questions.push({ id: 'q-' + uid(), text, keywords: '', suggest: '', status: 'gevraagd' });
      save(); closeDrawer(); render(); copyAndOpenSlack(askMessage([text]));
    },
    askUnknown: () => {
      const { unknown } = catchupData();
      const picked = [...document.querySelectorAll('[data-unk]:checked')].map((c) => unknown[+c.dataset.unk]);
      if (!picked.length) return toast('Vink eerst de items aan waarover je twijfelt');
      const lines = picked.map((u) => {
        const ds = u.dates.slice(0, 4).map((k) => { const d = parseKey(k); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }).join(', ');
        const text = `"${u.title}" (${ds}${u.dates.length > 4 ? ' e.a.' : ''}, ${fmtHours(u.min / 60)} uur): op welk AFAS-project schrijf ik dit?`;
        if (!state.questions.some((q) => q.text === text)) state.questions.push({ id: 'q-' + uid(), text, keywords: u.title, suggest: '', status: 'gevraagd' });
        return text;
      });
      save(); render(); copyAndOpenSlack(askMessage(lines));
    },
    askQ: () => copyAndOpenSlack(askMessage([questionFrom(t).text])),
    askAll: () => copyAndOpenSlack(askMessage(state.questions.filter((q) => q.status !== 'beantwoord').map((q) => q.text))),
    answerQ: () => {
      const q = questionFrom(t);
      let pid = document.querySelector(`[data-qans="${q.id}"]`).value;
      const nr = document.querySelector(`[data-qnr="${q.id}"]`).value.trim();
      if (nr) {
        let p = state.projects.find((x) => x.nr === nr);
        if (!p) {
          p = { id: 'p' + nr, nr, name: 'Project ' + nr + ' (naam aanvullen)', admin: '', werksoort: state.settings.defaultWerksoort || 'VIDEO', color: PALETTE[state.projects.length % PALETTE.length], keywords: '', fullDay: false, active: true };
          state.projects.splice(state.projects.length - 1, 0, p);
          toast(`Project ${nr} aangemaakt; vul de naam aan bij Projecten`);
        }
        pid = p.id;
      }
      if (!pid) return toast('Kies het project of typ het nummer dat je collega noemde');
      for (const k of String(q.keywords || '').split(',')) addKeyword(pid, k);
      if (q.ref) state.assign[q.ref] = pid;
      q.status = 'beantwoord'; q.answer = pid;
      save(); render(); openQuestions(); toast('Verwerkt');
    },
    dropQ: () => { questionFrom(t).status = 'beantwoord'; save(); render(); openQuestions(); },
    pasteProjects: openPasteProjects,
    addProject: () => { state.projects.splice(state.projects.length - 1, 0, { id: 'p' + uid(), nr: '', name: 'Nieuw project', admin: '', werksoort: state.settings.defaultWerksoort || 'VIDEO', color: PALETTE[state.projects.length % PALETTE.length], keywords: '', fullDay: false, active: true }); save(); render(); },
    copyTable: () => copyText(tableText('\t'), 'Tabel gekopieerd'),
    csv: () => {
      const blob = new Blob(['﻿' + tableText(';')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `uren-${weekId()}.csv`; a.click();
    },
    toggleClosed: () => {
      const k = weekId();
      state.closed = state.closed || {};
      if (state.closed[k]) { if (!confirm('Week heropenen? De export wordt dan pas weer gemaakt als je de week opnieuw afsluit.')) return; delete state.closed[k]; if (state.exports) delete state.exports[dkey(week)]; }
      else state.closed[k] = new Date().toISOString();
      save(); render();
    },
    copyExport: () => copyText(exportText(), 'Export gekopieerd'),
    afasRequest: async () => {
      await api('/api/afas-request', { method: 'POST', body: JSON.stringify({ monday: dkey(week) }) });
      await pollAfasTab();
      toast(afasTabInfo.tab && afasTabInfo.tab.monday === dkey(week) ? 'Wordt nu ingevuld in je AFAS-tabblad' : `Ga naar je AFAS-tabblad en kies week ${isoWeek(week).week}; dan wordt hij ingevuld`);
    },
    toggleDone: () => { const k = weekId(); if (state.reported[k]) delete state.reported[k]; else state.reported[k] = new Date().toISOString(); save(); render(); },
    exportState: () => { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'uren-instellingen.json'; a.click(); },
  };
  if (actions[act]) actions[act]();
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.grp !== undefined && drawerCtx && drawerCtx.groups) {
    assignPieces(drawerCtx.groups[+t.dataset.grp].pieces, t.value); noteRecent(t.value);
    save(); const ref = drawerCtx.b; render();
    // Lade open houden met verse berekening van hetzelfde blok.
    const day = weekData.days.find((d) => d.key === dkey(new Date(ref.s)));
    const nb = day && day.blocks.find((b) => b.kind === 'act' && b.s <= ref.s + 1 && b.e >= ref.s);
    if (nb) { drawerCtx = { b: nb }; openActDrawer(nb); }
    return;
  }
  if (t.dataset.unkproj !== undefined && t.value) {
    const u = catchupData().unknown[+t.dataset.unkproj];
    addKeyword(t.value, u.title);
    save(); render(); return;
  }
  if (t.dataset.pf) {
    const p = state.projects[+t.closest('tr').dataset.pi];
    p[t.dataset.pf] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.pf === 'nr' && p.id.startsWith('p') && !state.projects.some((x) => x !== p && x.id === 'p' + p.nr)) { /* id blijft stabiel */ }
    save(); return;
  }
  if (t.dataset.sf) {
    const k = t.dataset.sf;
    state.settings[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' || k === 'rounding' ? Number(t.value) : t.value;
    save(); computeWeek(); if (k === 'catchupFrom') { catchupActs = null; render(); } return;
  }
  if (t.dataset.ownsrc !== undefined) {
    const src = t.dataset.ownsrc.toLowerCase();
    let own = ownList().filter((x) => x !== src);
    if (t.checked) own.push(src);
    state.settings.ownSources = own.join(', ');
    // Alleen agenda's van je eigen accounts tellen mee; feestdagen en verjaardagen nooit.
    for (const c of calData.calendars) {
      const mine = own.includes(String(c.source || '').toLowerCase()) && !/feestdag|holiday|birthday|verjaardag/i.test(c.title);
      if (mine) delete state.calendarsOff[c.id]; else state.calendarsOff[c.id] = true;
    }
    save(); render(); return;
  }
  if (t.dataset.calon) { if (t.checked) delete state.calendarsOff[t.dataset.calon]; else state.calendarsOff[t.dataset.calon] = true; save(); return; }
  if (t.dataset.calmap) { if (t.value) state.calendarMap[t.dataset.calmap] = t.value; else delete state.calendarMap[t.dataset.calmap]; save(); return; }
  if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then((txt) => { state = normalize(JSON.parse(txt)); save(); render(); toast('Instellingen geïmporteerd'); }).catch(() => toast('Ongeldig bestand'));
  }
});

document.addEventListener('input', (e) => {
  if (e.target.dataset.nrinput === undefined) return;
  const v = e.target.value.trim();
  const hint = e.target.closest('div').parentElement.querySelector('[data-nrhint]');
  const nr = nrFrom(v);
  const c = nr && catalog.find((x) => x.nr === nr);
  if (hint) hint.textContent = c ? `${c.nr} ${c.name} · ${c.client}${c.start ? ' · aanvang ' + c.start : ''}` : (nr ? 'nummer niet in de catalogus' : '');
  const box = e.target.closest('div').parentElement.querySelector('[data-nrresults]');
  if (box) {
    const res = v.length >= 2 && !c ? searchCatalog(v) : [];
    box.innerHTML = res.map((r) => `<button data-act="pickSuggest" data-nr="${r.nr}" data-scope="${e.target.dataset.scope}"><b class="mono">${r.nr}</b> ${esc(r.name)} <span class="muted">· ${esc(r.client)}${r.start ? ' · ' + r.start : ''}${r.own ? ' · in je lijst' : ''}</span></button>`).join('') || (v.length >= 2 && !c ? '<span class="small muted">Geen project gevonden</span>' : '');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.target.dataset.nrinput === undefined) return;
  e.preventDefault();
  pickFor(e.target.dataset.scope, nrFrom(e.target.value));
});
// ---------- Slepen in het weekraster ----------
// Lege plek slepen = nieuw handmatig blok. Handmatig blok slepen = verplaatsen (ook naar een andere dag). Onderrand = eindtijd.
const SNAP = 15;
const snap = (min) => Math.round(min / SNAP) * SNAP;
const minToHHMM = (min) => { min = Math.max(0, Math.min(24 * 60 - 1, min)); return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`; };
const hhmmToMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function colAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest('.col[data-col]'); }
function minAt(col, y) { return snap((y - col.getBoundingClientRect().top) / PX + gridH0 * 60); }
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', (e) => {
  if (tab !== 'week' || e.button !== 0) return;
  const blk = e.target.closest('.blk');
  const col = e.target.closest('.col[data-col]');
  if (!col) return;
  if (blk && blk.classList.contains('man')) {
    const m = state.manual.find((x) => x.id === blk.dataset.mid);
    if (!m) return;
    const resize = !!e.target.closest('.resz');
    drag = { type: resize ? 'resize' : 'move', m, blk, x0: e.clientX, y0: e.clientY, s0: hhmmToMin(m.start), e0: hhmmToMin(m.end), moved: false, grab: minAt(col, e.clientY) - hhmmToMin(m.start) };
  } else if (!blk) {
    const start = minAt(col, e.clientY);
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    col.appendChild(ghost);
    drag = { type: 'create', col, start, end: start + SNAP, ghost, moved: false, y0: e.clientY };
  } else return;
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientY - (drag.y0 ?? 0)) < 4 && Math.abs(e.clientX - (drag.x0 ?? e.clientX)) < 4) return;
  drag.moved = true;
  if (drag.type === 'create') {
    const cur = minAt(drag.col, e.clientY);
    drag.a = Math.min(drag.start, cur); drag.b = Math.max(drag.start + SNAP, cur);
    drag.ghost.style.top = (drag.a - gridH0 * 60) * PX + 'px';
    drag.ghost.style.height = Math.max(10, (drag.b - drag.a) * PX - 2) + 'px';
    drag.ghost.textContent = `${minToHHMM(drag.a)}-${minToHHMM(drag.b)}`;
    return;
  }
  const col = colAt(e.clientX, e.clientY);
  drag.blk.classList.add('dragging');
  if (drag.type === 'resize') {
    const c = drag.blk.closest('.col');
    drag.ns = drag.s0; drag.ne = Math.max(drag.s0 + SNAP, minAt(c, e.clientY));
    drag.blk.style.height = Math.max(14, (drag.ne - drag.ns) * PX - 2) + 'px';
  } else {
    if (!col) return;
    const dur = drag.e0 - drag.s0;
    drag.ns = Math.max(0, minAt(col, e.clientY) - snap(drag.grab)); drag.ne = Math.min(24 * 60 - 1, drag.ns + dur);
    drag.date = col.dataset.col;
    if (drag.blk.parentElement !== col) col.appendChild(drag.blk);
    drag.blk.style.top = (drag.ns - gridH0 * 60) * PX + 'px';
    drag.blk.style.left = '2px'; drag.blk.style.width = 'calc(100% - 4px)';
  }
  const meta = drag.blk.querySelector('.m');
  if (meta) meta.textContent = `${minToHHMM(drag.ns)}-${minToHHMM(drag.ne)}`;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.type === 'create') {
    d.ghost.remove();
    if (d.moved && d.b - d.a >= SNAP) openManualDrawer(null, d.col.dataset.col, { start: minToHHMM(d.a), end: minToHHMM(d.b) });
    return;
  }
  if (!d.moved) return; // gewone klik: de lade opent via de klikafhandeling
  suppressClick = true; setTimeout(() => (suppressClick = false), 0);
  d.m.start = minToHHMM(d.ns); d.m.end = minToHHMM(d.ne);
  if (d.date) d.m.date = d.date;
  save(); render();
  toast(`Blok verplaatst naar ${minToHHMM(d.ns)}-${minToHHMM(d.ne)}`);
});
document.addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
// ---------- Rechtsklikmenu: vaste interne posten ----------
const quickNrs = () => String(state.settings.quickNrs || '').split(/[,\s]+/).filter((x) => /^\d{6}$/.test(x));
let ctx = null;
function closeCtx() { const el = document.querySelector('.ctxmenu'); if (el) el.remove(); ctx = null; }
function openCtx(x, y, target) {
  closeCtx();
  ctx = target;
  const items = quickNrs().map((nr) => state.projects.find((p) => p.nr === nr) || ensureProject(nr)).filter(Boolean);
  const quickIds = new Set(items.map((p) => p.id));
  const weekIds = weekData ? Object.entries(weekData.totals).sort((a, b) => b[1] - a[1]).map(([pid]) => pid) : [];
  const recent = [...new Set((state.recent || []).concat(weekIds))].filter((pid) => pid !== 'ignore' && !quickIds.has(pid) && proj(pid)).slice(0, 6).map(proj);
  const btn = (p, short) => `<button data-ctxpid="${p.id}"><span class="sw" style="background:${p.color}"></span><span class="mono">${esc(p.nr)}</span> ${esc(short ? p.name.replace(/^(Intern|Indirect|TVP) - /, '') : p.name)}</button>`;
  const head = target.kind === 'new' ? `Nieuw blok ${target.start}-${target.end}` : 'Toewijzen aan';
  const el = document.createElement('div');
  el.className = 'ctxmenu';
  el.innerHTML = `<div class="hd">${esc(head)}</div>`
    + (recent.length ? `<div class="hd">Recent</div>` + recent.map((p) => btn(p, false)).join('') + `<hr><div class="hd">Vaste posten</div>` : '')
    + items.map((p) => btn(p, true)).join('')
    + `<button data-ctxpid="ignore"><span class="sw" style="background:${projColor('ignore')}"></span>Negeren (privé / pauze)</button><hr>`
    + `<button data-ctxother="1">Ander project…</button>`;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  el.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  const first = el.querySelector('button'); if (first) first.focus();
}
document.addEventListener('contextmenu', (e) => {
  if (tab !== 'week') return;
  const blkEl = e.target.closest('[data-b]');
  const col = e.target.closest('.col[data-col]');
  if (blkEl) {
    e.preventDefault();
    const b = findBlock(blkEl.dataset.b);
    if (b) openCtx(e.clientX, e.clientY, { kind: 'block', b, ref: blkEl.dataset.b });
  } else if (col) {
    e.preventDefault();
    const start = Math.max(0, minAt(col, e.clientY));
    openCtx(e.clientX, e.clientY, { kind: 'new', date: col.dataset.col, start: minToHHMM(start), end: minToHHMM(start + 60) });
  }
});
document.addEventListener('mousedown', (e) => { if (ctx && !e.target.closest('.ctxmenu')) closeCtx(); }, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ctx) closeCtx(); });
window.addEventListener('scroll', () => { if (ctx) closeCtx(); }, true);
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.ctxmenu button');
  if (!btn || !ctx) return;
  const t = ctx; closeCtx();
  if (btn.dataset.ctxother) {
    if (t.kind === 'new') openManualDrawer(null, t.date, { start: t.start, end: t.end });
    else openBlock(t.ref);
    return;
  }
  const pid = btn.dataset.ctxpid;
  noteRecent(pid);
  if (t.kind === 'new') {
    state.manual.push({ id: uid(), date: t.date, start: t.start, end: t.end, projectId: pid, note: '' });
  } else {
    const b = t.b;
    if (b.kind === 'cal') state.assign['ev:' + b.ref.id] = pid;
    else if (b.kind === 'act') assignPieces(b.pieces, pid);
    else if (b.kind === 'manual') b.ref.projectId = pid;
  }
  save(); render();
  toast(t.kind === 'new' ? `Blok ${t.start}-${t.end} toegevoegd op ${projLabel(pid)}` : `Toegewezen aan ${projLabel(pid)}`);
});
document.getElementById('dClose').onclick = closeDrawer;
async function gotoWeek(d) { week = mondayOf(d); renderHeader(); await loadActivity(); render(); }
document.getElementById('prevWeek').onclick = () => gotoWeek(addDays(week, -7));
document.getElementById('nextWeek').onclick = () => gotoWeek(addDays(week, 7));
document.getElementById('thisWeek').onclick = () => gotoWeek(new Date());
document.getElementById('refresh').onclick = async () => {
  const btn = document.getElementById('refresh');
  btn.classList.add('busy');
  const before = calData.events.length;
  let ok = false;
  try { ok = (await api('/api/refresh', { method: 'POST' })).ok; } catch {}
  await Promise.all([loadCalendar().catch(() => {}), loadActivity().catch(() => {}), loadStatus()]);
  btn.classList.remove('busy');
  render();
  if (!ok) return toast(status.alive ? 'De meter reageerde niet; probeer het zo nog eens' : 'De meter draait niet, dus de agenda kan niet ververst worden');
  const diff = calData.events.length - before;
  toast(`Agenda opnieuw ingelezen: ${calData.events.length} afspraken${diff ? ` (${diff > 0 ? '+' : ''}${diff})` : ''}`);
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') gotoWeek(addDays(week, -7));
  if (e.key === 'ArrowRight') gotoWeek(addDays(week, 7));
});

async function boot() {
  try { state = normalize(await api('/api/state')); } catch { state = defaultState(); }
  save();
  await Promise.all([loadCalendar().catch(() => {}), loadActivity().catch(() => {}), loadStatus(), loadCatalog()]);
  render();
  setInterval(loadStatus, 15000);
  // Elke minuut verse activiteit, tenzij de gebruiker net iets bewerkt.
  setInterval(async () => {
    if (document.getElementById('drawer').classList.contains('open')) return;
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    await Promise.all([loadCalendar().catch(() => {}), loadActivity().catch(() => {})]);
    render();
  }, 60000);
}
boot();
</script>
